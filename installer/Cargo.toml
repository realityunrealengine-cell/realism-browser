[package]
name = "realism-setup"
version = "1.0.0"
edition = "2024"
build = "build.rs"
description = "Realism Browser installer / uninstaller"

[[bin]]
name = "realism-setup"
path = "src/main.rs"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_Security",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Controls",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Storage_FileSystem",
]

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[workspace]
