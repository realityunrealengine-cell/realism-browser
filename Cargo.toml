[package]
name = "realism"
version = "1.1.0"
edition = "2024"
description = "Realism Browser - lightweight WebView2 browser"
build = "build.rs"
default-run = "realism"

[[bin]]
name = "realism"
path = "src/main.rs"

[[bin]]
name = "realism-bench"
path = "src/bin/realism-bench.rs"

[dependencies]
wry = { version = "0.57.3", default-features = false, features = ["devtools"] }
webview2-com = "0.39"
windows-core = "0.62"
windows-numerics = "0.3"
raw-window-handle = "0.6"
http = "1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Imaging",
  "Win32_Networking_WinHttp",
  "Win32_Security_Cryptography",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Ole",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
